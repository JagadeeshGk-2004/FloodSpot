name: Generate & Publish QA Test Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-export-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Generate QA Workbook
        run: |
          python generate_qa_report.py

      - name: Upload Downloadable Excel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Automation Testing 1200
          path: docs/Automation Testing 1200.xlsx
          retention-days: 30
